<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Boite de Reception - AnonBF</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glass-container" style="max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h1 class="logo" style="margin: 0;">AnonBF</h1>
            <button id="btn-logout" class="btn-secondary" style="padding: 5px 10px; font-size: 0.8em;">Deconnexion</button>
        </div>

        <!-- Section Mon Lien -->
        <div style="background: rgba(255,255,255,0.08); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <p style="margin-top: 0; font-weight: bold;">Mon Lien Personnel</p>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <input type="text" id="link-input" readonly style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff;">
                <button id="btn-copy" class="btn btn-primary" style="white-space: nowrap;">Copier</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <a id="self-send-link" href="#" target="_blank" class="link" style="font-size: 0.85em;">[+] M'envoyer un message a moi-meme</a>
            </div>
        </div>

        <!-- Explication de l'utilisation du lien -->
        <div style="text-align: left; font-size: 0.85em; background: rgba(0,0,0,0.15); padding: 10px 15px; border-radius: 8px; margin-bottom: 20px;">
            <strong>Comment partager votre lien ?</strong>
            <p style="margin: 5px 0 0 0;">Copiez le lien ci-dessus et collez-le dans votre bio Instagram, WhatsApp, TikTok ou Facebook pour recevoir des questions anonymes.</p>
        </div>

        <!-- Section Messages Reçus -->
        <div style="text-align: left;">
            <h2 style="font-size: 1.2em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between;">
                <span>Messages Recus</span>
                <span id="notif-badge" style="background: #e74c3c; color: white; border-radius: 12px; padding: 2px 8px; font-size: 0.75em; display: none;">0</span>
            </h2>
            <div id="messages-list" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- Canvas cache pour la generation d'image de carte -->
    <canvas id="card-canvas" width="600" height="600" style="display: none;"></canvas>

    <script type="module" src="js/messages.js"></script>
</body>
</html>
