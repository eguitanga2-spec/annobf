<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Messages - AnonBF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1 class="logo">AnonBF</h1>
        <p class="tagline">Boîte de réception 📥 <span id="notif-badge" class="badge" style="display:none;">0</span></p>

        <div class="share-box">
            <p style="margin-bottom: 8px; font-weight: 600;">Ton lien personnel :</p>
            <input type="text" id="link-input" readonly style="width:100%; padding:8px; border-radius:8px; border:1px solid #ccc; text-align:center; margin-bottom:8px;">
            <button id="btn-copy" class="btn btn-secondary" style="padding: 8px 12px; font-size: 0.85rem;">📋 Copier mon lien</button>
        </div>

        <div id="messages-list" style="margin-top: 20px;">
            Chargement des messages...
        </div>

        <div class="footer-link">
            <button id="btn-logout" class="btn btn-secondary" style="margin-top: 20px;">Se déconnecter</button>
        </div>
    </div>

    <script type="module" src="js/messages.js"></script>
</body>
</html>
