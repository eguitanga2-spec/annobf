<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Messages - AnonBF</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .link-card-glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        .link-box-inner {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 6px 6px 6px 12px;
            margin-top: 10px;
        }
        .link-input-styled {
            border: none;
            background: transparent;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 0.9em;
        }
        .badge-count {
            background: #ff4757;
            color: #fff;
            font-size: 0.75em;
            padding: 3px 9px;
            border-radius: 20px;
            font-weight: bold;
        }
        .msg-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .btn-wa {
            background: #25D366;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8em;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-dl {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 650px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 class="logo" style="margin: 0; text-align: left;">AnonBF</h1>
                <span id="user-display-name" style="font-size: 0.85em; color: rgba(255,255,255,0.8);">...</span>
            </div>
            <button id="btn-logout" class="btn-secondary" style="padding: 6px 14px; font-size: 0.8em;">Déconnexion</button>
        </div>

        <!-- Section Copie de Lien Redessinée -->
        <div class="link-card-glass">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 600; font-size: 0.95em;">Ton Lien de Partage</span>
                <a id="self-send-link" href="#" target="_blank" class="link" style="font-size: 0.8em;">M'écrire à moi-même</a>
            </div>
            <div class="link-box-inner">
                <input type="text" id="link-input" class="link-input-styled" readonly>
                <button id="btn-copy" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85em; border-radius: 8px; white-space: nowrap;">Copier</button>
            </div>
        </div>

        <!-- Boîte de Réception -->
        <div style="text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 1.1em; margin: 0;">Messages Reçus</h2>
                <span id="notif-badge" class="badge-count" style="display: none;">0</span>
            </div>
            <div id="messages-list"></div>
        </div>
    </div>

    <!-- Canvas HTML5 pour Génération d'Image Story (1080x1920) Liquid Glass -->
    <canvas id="story-canvas" width="1080" height="1920" style="display: none;"></canvas>

    <script type="module" src="js/messages.js"></script>
</body>
</html>
