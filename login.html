<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - AnonBF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1 class="logo">AnonBF</h1>
        <p class="tagline">Connexion 🔐</p>

        <form id="login-form" class="form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Adresse email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Mot de passe" required>
            </div>
            <div id="error-message" class="error-msg"></div>
            <button type="submit" class="btn btn-primary" id="btn-submit">Se connecter</button>
        </form>

        <div class="footer-link">
            <a href="register.html" class="link">Créer un compte</a>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
