<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AnonBF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1 class="logo">AnonBF</h1>
        <p class="tagline">Se connecter a votre espace</p>

        <form id="login-form" class="form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Adresse email" required autocomplete="email">
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
            </div>

            <div class="remember-group" style="text-align: left; margin: 10px 0; font-size: 0.9em; color: #fff;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="remember-me" checked>
                    Se souvenir de moi
                </label>
            </div>

            <div id="error-message" class="error-msg"></div>

            <button type="submit" class="btn btn-primary" id="btn-submit">Se connecter</button>
        </form>

        <div class="footer-link">
            <a href="register.html" class="link">Pas encore de compte ? Creer un lien</a>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
