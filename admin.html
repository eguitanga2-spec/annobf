<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Admin - AnonBF</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85em;
            color: #fff;
        }
        th, td {
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            text-align: left;
        }
        th {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 900px;">
        <h1 class="logo">AnonBF Admin</h1>
        <p class="tagline">Supervision de sécurité des messages</p>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Expéditeur (Email / UID)</th>
                        <th>Destinataire</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="admin-table"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
