<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoyer un message - AnonBF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1 class="logo">AnonBF</h1>
        <p class="tagline">Envoyer un message anonyme à <br><strong id="target-user" style="font-size: 1.2em; color: #fff;">...</strong></p>

        <div id="sender-status" style="margin-bottom: 15px; font-size: 0.85em; background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px;"></div>

        <form id="send-form" class="form">
            <div class="input-group">
                <textarea id="message-text" placeholder="Écris ton message anonyme ici..." required maxlength="500" rows="5"></textarea>
            </div>

            <div id="status-message" class="status-msg"></div>

            <button type="submit" class="btn btn-primary" id="btn-send">Envoyer le message</button>
        </form>

        <div class="footer-link" style="margin-top: 20px;">
            <a href="register.html" class="link">Obtenir ton propre lien AnonBF</a>
        </div>
    </div>

    <script type="module" src="js/send.js"></script>
</body>
</html>
