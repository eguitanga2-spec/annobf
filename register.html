<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - AnonBF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1 class="logo">AnonBF</h1>
        <p class="tagline">Créer ton lien unique</p>

        <form id="register-form" class="form">
            <div class="input-group">
                <input type="text" id="fullname" placeholder="Nom et Prénom (ex: Marc Dupont)" required autocomplete="name">
            </div>

            <div class="input-group">
                <input type="text" id="username" placeholder="Pseudo unique pour ton lien (ex: marc226)" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Adresse email" required autocomplete="email">
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Mot de passe (6 car. min)" required minlength="6" autocomplete="new-password">
            </div>

            <div id="error-message" class="error-msg"></div>

            <button type="submit" class="btn btn-primary" id="btn-submit">Créer mon lien</button>
        </form>

        <div class="footer-link">
            <a href="login.html" class="link">Déjà inscrit ? Se connecter</a>
        </div>
    </div>

    <script type="module" src="js/register.js"></script>
</body>
</html>
